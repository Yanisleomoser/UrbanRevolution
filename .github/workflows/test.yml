# Test-Runner (Check-Name = Job-ID `validate`, bleibt stabil): npm run build
# (No-op der statischen Site) + npm test (21 Offline-Suiten). Hieß früher
# webpack.yml — es lief nie Webpack.
name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x

    - name: Install dependencies
      run: npm install

    - name: Validate
      run: |
        echo "✓ Static site validated - no build needed"
        npm run build

    - name: Run unit tests
      run: npm test
