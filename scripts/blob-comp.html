<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Thermal-Blob-Comp — Urban Revolution</title>
<!--
  Build-Quelle für assets/tblob-cool.webp + assets/tblob-thermal.webp —
  gerendert von scripts/render-blob.mjs (headless Chromium, SVG → Canvas →
  WebP MIT Alpha). Die Live-SVG-Filter (feGaussianBlur + feTurbulence) waren
  als Runtime-Instanzen zu teuer (Scroll-Jank auf Mobile) — deshalb werden
  die zwei Blob-Varianten hier EINMAL im Build gerastert und die Site
  komponiert nur noch fertige Bitmaps. Silhouette/Verläufe/Korn = identisch
  zur früheren Inline-Defs-Version (Thermal Signature, CLAUDE.md).
-->
</head>
<body style="margin:0;background:#333">
<svg id="cool" width="1600" height="1667" viewBox="0 0 1200 1250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="tb-path" d="M70,330C55,269,133,175,180,150C227,125,295,83,370,70C445,57,496,39,520,50C544,61,552,79,575,115C598,151,617,242,645,265C673,288,712,148,745,125C778,102,804,90,850,90C896,90,975,124,1020,170C1065,216,1121,323,1140,420C1159,517,1157,660,1155,760C1153,860,1076,934,1000,1010C924,1086,806,1141,700,1190C594,1239,467,1272,420,1245C373,1218,340,1102,310,1040C280,978,175,972,120,920C65,868,64,733,60,660C56,587,297,568,290,490C283,412,95,443,100,380C105,317,85,391,70,330Z"/>
    <clipPath id="tb-clip"><use href="#tb-path"/></clipPath>
    <linearGradient id="tb-body" x1="0.78" y1="0.04" x2="0.16" y2="0.92">
      <stop offset="0" stop-color="#727bd8"/>
      <stop offset="0.38" stop-color="#5560b8"/>
      <stop offset="0.72" stop-color="#333a78"/>
      <stop offset="1" stop-color="#1e2246"/>
    </linearGradient>
    <radialGradient id="tb-hi" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9aa2ee" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#9aa2ee" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#9aa2ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-steel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7f96cf" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#5f86b8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5f86b8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-deep" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10132c" stop-opacity="0.7"/>
      <stop offset="0.6" stop-color="#161a38" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#161a38" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-green" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#46c40e" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7edc2e" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7edc2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tb-core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f68f38"/>
      <stop offset="0.4" stop-color="#ef7c26" stop-opacity="0.98"/>
      <stop offset="0.68" stop-color="#e2a816" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c9b70a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tb-rimgrad" x1="0.15" y1="0.95" x2="0.8" y2="0.1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.72" stop-color="#000"/>
    </linearGradient>
    <mask id="tb-rimmask"><rect width="1200" height="1250" fill="url(#tb-rimgrad)"/></mask>
    <filter id="tb-fx" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="art"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" stitchTiles="stitch" result="turb"/>
      <feColorMatrix in="turb" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.85  0 0 0 0 0.9  1 1 1 0 -1.15" result="gn"/>
      <feComposite in="gn" in2="art" operator="in" result="gnClip"/>
      <feBlend in="gnClip" in2="art" mode="overlay" result="mix"/>
      <feComposite in="mix" in2="art" operator="in"/>
    </filter>
    <g id="tblob-cool-g" filter="url(#tb-fx)">
      <use href="#tb-path" fill="none" stroke="#7edc2e" stroke-width="13" opacity="0.85" mask="url(#tb-rimmask)"/>
      <use href="#tb-path" fill="url(#tb-body)"/>
      <g clip-path="url(#tb-clip)">
        <ellipse cx="930" cy="300" rx="330" ry="300" fill="url(#tb-hi)"/>
        <ellipse cx="1030" cy="680" rx="330" ry="400" fill="url(#tb-steel)"/>
        <ellipse cx="600" cy="440" rx="460" ry="230" fill="url(#tb-deep)" transform="rotate(-22 600 440)"/>
        <ellipse cx="680" cy="1180" rx="400" ry="190" fill="url(#tb-deep)"/>
        <ellipse cx="330" cy="960" rx="300" ry="300" fill="url(#tb-green)"/>

    </g>
    <g id="tblob-thermal-g" filter="url(#tb-fx)">
      <use href="#tb-path" fill="none" stroke="#7edc2e" stroke-width="13" opacity="0.85" mask="url(#tb-rimmask)"/>
      <use href="#tb-path" fill="url(#tb-body)"/>
      <g clip-path="url(#tb-clip)">
        <ellipse cx="930" cy="300" rx="330" ry="300" fill="url(#tb-hi)"/>
        <ellipse cx="1030" cy="680" rx="330" ry="400" fill="url(#tb-steel)"/>
        <ellipse cx="600" cy="440" rx="460" ry="230" fill="url(#tb-deep)" transform="rotate(-22 600 440)"/>
        <ellipse cx="680" cy="1180" rx="400" ry="190" fill="url(#tb-deep)"/>
        <ellipse cx="330" cy="960" rx="300" ry="300" fill="url(#tb-green)"/>
        <ellipse cx="680" cy="1030" rx="240" ry="210" fill="url(#tb-green)" opacity="0.75"/>
        <ellipse cx="480" cy="1000" rx="225" ry="260" fill="url(#tb-core)"/>
      </g>
    </g>
  </defs>
  <use href="#tblob-cool-g"/>
</svg>
<svg id="thermal" width="1600" height="1667" viewBox="0 0 1200 1250" xmlns="http://www.w3.org/2000/svg">
  <use href="#tblob-thermal-g"/>
</svg>
</body>
</html>
