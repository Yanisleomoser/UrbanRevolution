<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG-Comp — Urban Revolution</title>
<!--
  Social-Share-Comp (1200×630) für assets/og-image.png — gerendert von
  scripts/render-og.mjs (headless Chromium, Element-Screenshot auf #card).

  Sprache des Hero (Ehrlichkeits-Regeln, KI-Rolle):
  - Eyebrow: GERETTETE FASER · DEIN ENTWURF · AUTONOM GEFERTIGT
    (KI sortiert & fertigt — sie entwirft NIE; kein Preis, keine Lieferzeit)
  - Headline: Thin-Caps „MADE FOR ONE." / Thermal-Gradient „NOT FOR ALL."
  - Motiv: der Glut-Faden (Akt I, Abfall brennt warm) läuft nach rechts und
    wird zum kühlen Thermal-Kreis (Akt II, Kreislauf) — die Wende der
    Landing-Dramaturgie als ein durchgehender Wärmebild-Verlauf.
  Tokens wie in css/styles.css (:root) — Thermal Signature: Nachtschwarz,
  Periwinkle→Teal→Leucht-Grün, Glut-Familie. Fonts selbst gehostet aus
  /assets/fonts/ (Poppins Thin-Caps als Display).
-->
<style>
  @font-face {
    font-family: "Poppins";
    src: url("/assets/fonts/poppins-100-normal-latin.woff2") format("woff2");
    font-weight: 100;
    font-style: normal;
  }
  @font-face {
    font-family: "Poppins";
    src: url("/assets/fonts/poppins-200-normal-latin.woff2") format("woff2");
    font-weight: 200;
    font-style: normal;
  }
  @font-face {
    font-family: "JetBrains Mono";
    src: url("/assets/fonts/jetbrainsmono-500-normal-latin.woff2") format("woff2");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Poppins";
    src: url("/assets/fonts/poppins-400-normal-latin.woff2") format("woff2");
    font-weight: 400;
    font-style: normal;
  }

  :root {
    --bg: #0B0B0D;
    --text: #F1F2F8;
    --text-dim: #A9AECD;
    --accent: #6A71D6;
    --accent-2: #12A37A;
    --accent-3: #7EDC2E;
    --warm-thread: #EF7C26;
    --warm-bright: #F5C050;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; display: grid; place-items: center; min-height: 100vh; }

  #card {
    position: relative;
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background:
      radial-gradient(1100px 620px at 88% 30%, rgba(106, 113, 214, 0.16), transparent 62%),
      radial-gradient(900px 700px at 8% 108%, rgba(239, 124, 38, 0.10), transparent 58%),
      var(--bg);
    color: var(--text);
  }

  .thread { position: absolute; inset: 0; }

  .brand {
    position: absolute;
    top: 54px;
    left: 64px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: "JetBrains Mono", monospace;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.32em;
    color: var(--text-dim);
  }

  .copy { position: absolute; left: 64px; top: 205px; }
  .eyebrow {
    font-family: "JetBrains Mono", monospace;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.15em;
    color: var(--accent-3);
    white-space: nowrap;
  }
  .eyebrow .warm { color: var(--warm-bright); }
  .eyebrow .dot { color: var(--text-dim); padding: 0 6px; }
  h1 {
    margin-top: 34px;
    font-family: "Poppins", sans-serif;
    font-weight: 100;
    font-size: 93px;
    line-height: 1.14;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  h1 .grad {
    font-weight: 200;
    background: linear-gradient(92deg, var(--accent) 0%, var(--accent-2) 55%, var(--accent-3) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    padding-right: 0.08em;
  }

  .domain {
    position: absolute;
    right: 64px;
    bottom: 54px;
    font-family: "JetBrains Mono", monospace;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.22em;
    color: var(--text-dim);
  }
</style>
</head>
<body>
<div id="card">
  <!-- Der Faden: Glut-Linie (Akt I) läuft ein und wird rechts zum kühlen
       Thermal-Kreis (Akt II) — ein Pfad, ein Wärmebild-Verlauf, die Wende. -->
  <svg class="thread" viewBox="0 0 1200 630" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="turn" gradientUnits="userSpaceOnUse" x1="0" y1="560" x2="1120" y2="240">
        <stop offset="0" stop-color="#EF7C26" stop-opacity="0.85"/>
        <stop offset="0.5" stop-color="#EF7C26" stop-opacity="0.9"/>
        <stop offset="0.68" stop-color="#6A71D6"/>
        <stop offset="0.86" stop-color="#12A37A"/>
        <stop offset="1" stop-color="#7EDC2E"/>
      </linearGradient>
      <radialGradient id="ringGlow" gradientUnits="userSpaceOnUse" cx="960" cy="330" r="230">
        <stop offset="0.55" stop-color="#12A37A" stop-opacity="0"/>
        <stop offset="0.78" stop-color="#12A37A" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#12A37A" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <!-- weicher Glow hinter dem Kreis (Zentrum = Ring-Zentrum 960/330) -->
    <circle cx="960" cy="330" r="215" fill="url(#ringGlow)"/>
    <!-- Faden: von links unten (Glut) mit horizontalem Tangens in den
         untersten Punkt des Rings (960/480), dann 330° gegen den Uhrzeiger
         (large-arc=1, sweep=0) — der Kreis bleibt 30° offen: er schliesst
         sich erst noch. Ring: Zentrum 960/330, r=150. -->
    <path d="M -24 560
             C 240 596, 430 588, 610 540
             C 740 505, 850 484, 960 480
             A 150 150 0 1 0 885 460"
          stroke="url(#turn)" stroke-width="5" stroke-linecap="round"/>
    <!-- leuchtendes Fadenende -->
    <circle cx="885" cy="460" r="7" fill="#7EDC2E"/>
    <circle cx="885" cy="460" r="16" fill="#7EDC2E" opacity="0.22"/>
  </svg>

  <div class="brand">
    <!-- Nadel-Kreis-Marke (vereinfachte Logo-Geste der Site) -->
    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <circle cx="20" cy="20" r="15" stroke="#7EDC2E" stroke-width="2.4" stroke-dasharray="66 28" stroke-linecap="round" transform="rotate(-64 20 20)"/>
      <line x1="20" y1="20" x2="31" y2="7" stroke="#F1F2F8" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
    URBAN REVOLUTION
  </div>

  <div class="copy">
    <p class="eyebrow"><span class="warm">GERETTETE FASER</span><span class="dot">&nbsp;·&nbsp;</span>DEIN ENTWURF<span class="dot">&nbsp;·&nbsp;</span>AUTONOM GEFERTIGT</p>
    <h1>Made for one.<br><span class="grad">Not for all.</span></h1>
  </div>

  <p class="domain">revolveurban.com</p>
</div>
</body>
</html>
